<div class="auth-page-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-badge">
        <i class="pi pi-key"></i>
      </div>
      <h1 class="auth-title">Reset password</h1>
      <p class="auth-subtitle">Enter your email and we'll send a 6-digit recovery code</p>
    </div>

    @if (errorMessage()) {
      <div class="auth-alert error-alert" role="alert">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
      <div class="field-group">
        <label for="email" class="field-label">Email address</label>
        <input
          pInputText
          id="email"
          type="email"
          formControlName="email"
          placeholder="name@example.com"
          class="auth-input"
          [class.ng-invalid]="form.controls.email.invalid && form.controls.email.touched"
          autocomplete="email"
        />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <small class="field-error">Enter a valid email address</small>
        }
      </div>

      <button
        pButton
        type="submit"
        label="Send Reset Code"
        icon="pi pi-arrow-right"
        iconPos="right"
        [loading]="isLoading()"
        class="auth-submit-btn"
      ></button>
    </form>

    <div class="auth-footer">
      <span>Remember your password?</span>
      <a routerLink="/login" class="auth-text-link">Sign in</a>
    </div>
  </div>
</div>
