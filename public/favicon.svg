<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>TaskNest</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="nest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="egg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Egg with checkmark (the "task") -->
  <ellipse cx="32" cy="27" rx="12" ry="14.5" fill="url(#egg)"/>
  <path d="M25.5 27.5l4.5 4.5 8.5-9" fill="none" stroke="#4f46e5" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Woven nest -->
  <path d="M8 34c3 18 45 18 48 0-9 6-39 6-48 0z" fill="url(#nest)"/>
  <path d="M12 40c10 5 30 5 40 0M17 46c8 3 22 3 30 0" fill="none" stroke="#92400e"
        stroke-width="2" stroke-linecap="round" opacity=".55"/>
  <path d="M8 34c9 6 39 6 48 0" fill="none" stroke="#fde68a" stroke-width="2.2"
        stroke-linecap="round"/>
</svg>
